name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- TRABAJO 1: PRUEBAS DE CALIDAD ---
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4' # <--- Tu versión correcta
        extensions: mbstring, bcmath, pdo, pdo_mysql

    - name: Install Dependencies
      run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

    - name: Copy .env
      run: cp .env.example .env

    - name: Generate Key
      run: php artisan key:generate

    - name: Run Static Analysis (Larastan)
      run: ./vendor/bin/phpstan analyse --memory-limit=2G

    - name: Run Tests (PHPUnit)
      run: php artisan test

  # --- TRABAJO 2: CONSTRUCCIÓN Y SUBIDA A DOCKER (NUEVO) ---
  build-push-docker:
    needs: test-and-analyze # ¡Solo corre si las pruebas pasan!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: aarondevops/bodega-api:latest